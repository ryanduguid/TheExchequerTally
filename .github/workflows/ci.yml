name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: install the locked toolchain
        run: python -m pip install "uv==0.12.0"
      - name: Ruff
        run: uv run --locked --extra dev ruff check edwinnixon tests
        env:
          UV_PYTHON: ${{ matrix.python }}
      - name: Typecheck
        continue-on-error: true
        run: uv run --locked --extra dev mypy edwinnixon
        env:
          UV_PYTHON: ${{ matrix.python }}
      - name: Run tests
        run: uv run --locked --extra dev pytest -q
        env:
          UV_PYTHON: ${{ matrix.python }}
