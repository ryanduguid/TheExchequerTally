[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exchequer-tally"
version = "0.1.0"
description = "Corporate tax rate verification, franking account ledger tracking, and Division 203 benchmark rule compliance for Australian companies."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ryan Duguid", email = "ryan@duguid.com.au" }
]
keywords = [
    "australian-tax",
    "franking-credits",
    "corporate-tax",
    "imputation-system",
    "base-rate-entity",
    "itaa1997",
    "accounting",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
frank-check = "exchequertally.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["exchequertally"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]