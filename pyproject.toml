[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edwinnixon"
version = "0.1.1"
description = "Corporate tax rate verification, franking account ledger tracking, and Division 203 benchmark rule compliance for Australian companies."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ryan Duguid", email = "ryan@duguid.com.au" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.11",
    "mypy>=1.14",
]

[project.scripts]
edwinnixon = "edwinnixon.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["edwinnixon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=edwinnixon --cov-report=term-missing"

[tool.ruff]
line-length = 100
src = ["edwinnixon", "tests"]

[tool.mypy]
python_version = "3.10"
packages = ["edwinnixon"]
pretty = true
